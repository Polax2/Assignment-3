name: A3 unit test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy joblib scikit-learn pytest

      - name: Run unit tests
        working-directory: app
        run: pytest -v

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: 276087/car-price-app3:latest

  deploy:
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/a3_github
          chmod 600 ~/.ssh/a3_github

          cat > ~/.ssh/config <<'EOF'
          Host bazooka-a3
            HostName bazooka.cs.ait.ac.th
            User st127173
            IdentityFile ~/.ssh/a3_github
            IdentitiesOnly yes
            StrictHostKeyChecking no

          Host mlbrain-a3
            HostName ml.brain.cs.ait.ac.th
            User st127173
            IdentityFile ~/.ssh/a3_github
            IdentitiesOnly yes
            ProxyJump bazooka-a3
            StrictHostKeyChecking no
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy A3
        run: |
          ssh mlbrain-a3 'cd /home/st127173/a3 && docker compose pull && docker compose up -d'
